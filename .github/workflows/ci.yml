name: CI

on:
  push:
    # 只对分支推送触发；tag 推送的门禁由 release.yml 自己执行，
    # 避免每次发版多出一条检出 tag 提交的重复 CI（易被误读为发布失败）
    branches:
      - "**"
  pull_request:

# S-13：显式声明最小权限，默认令牌只读
permissions:
  contents: read

jobs:
  checks:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # S-13：第三方 Action 一律按 commit SHA 锁定，防 tag 被移动指向恶意提交
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: npm

      - name: Test release checks
        run: node --test scripts/test-release-check.mjs

      # 本机与工作流共用唯一版本来源，并传递给后续 Cargo 子进程。
      - name: Read Rust toolchain
        id: rust_version
        run: node scripts/release-check.mjs --toolchain

      # 锁 SHA 后 action 无法从 ref 名推断 toolchain，必须显式传 toolchain
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust_version.outputs.version }}
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # S-01：pull_request 会执行 PR 内的 workflow 与 lockfile。令牌只读、无
      # secrets，但 npm 安装脚本仍会在 runner 上执行任意代码，--ignore-scripts
      # 是零成本的加固。注意（2026-08-16 审查修正）：依赖树并非"零安装脚本"——
      # esbuild/fsevents 均声明了 install script，只是 esbuild ≥0.17 实际改走
      # 平台 optionalDependencies 分发、fsevents 是 macOS-only，跳过后构建不受
      # 影响。未来引入真依赖 install script 的包（如 sharp）时须显式评估。
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      # S-09：与 release.yml 统一为 low，避免发布门禁比 CI 严导致「CI 绿、发布红」
      - name: Audit frontend dependencies
        run: npm audit --audit-level=low

      - name: Install cargo-audit
        # 本机 cargo audit --version 与 cargo install --list 已核实为 0.22.2。
        run: cargo install --locked cargo-audit --version '=0.22.2'

      # 所有公告完整显示，不再传 --ignore；未维护/unsound 警告仍需跟踪，
      # 漏洞由 cargo-audit 的默认失败策略阻断，不能把警告误称为已修复。
      - name: Audit Rust dependencies
        run: cargo audit

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test Rust
        run: cargo test --workspace --locked

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm run test

      - name: Build frontend
        run: npm run build
