name: CI

on:
  push:
    # 只对分支推送触发；tag 推送的门禁由 release.yml 自己执行，
    # 避免每次发版多出一条检出 tag 提交的重复 CI（易被误读为发布失败）
    branches:
      - "**"
  pull_request:

# S-13：显式声明最小权限，默认令牌只读
permissions:
  contents: read

jobs:
  checks:
    name: Build and test
    runs-on: windows-latest

    steps:
      # S-13：第三方 Action 一律按 commit SHA 锁定，防 tag 被移动指向恶意提交
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      # 锁 SHA 后 action 无法从 ref 名推断 toolchain，必须显式传 toolchain
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # S-01：pull_request 会执行 PR 内的 workflow 与 lockfile。令牌只读、无
      # secrets，但 npm 安装脚本仍会在 runner 上执行任意代码，--ignore-scripts
      # 是零成本的加固。注意（2026-08-16 审查修正）：依赖树并非"零安装脚本"——
      # esbuild/fsevents 均声明了 install script，只是 esbuild ≥0.17 实际改走
      # 平台 optionalDependencies 分发、fsevents 是 macOS-only，跳过后构建不受
      # 影响。未来引入真依赖 install script 的包（如 sharp）时须显式评估。
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      # S-09：与 release.yml 统一为 low，避免发布门禁比 CI 严导致「CI 绿、发布红」
      - name: Audit frontend dependencies
        run: npm audit --audit-level=low

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      # S-13/N-01：Rust 依赖漏洞审计。仅剩一条 ignore：
      # RUSTSEC-2024-0429 glib——unsound 类，修复版要 0.20 而 tauri 2 上游锁 0.18，
      # 且属 Linux-only gtk 栈、Windows 产物不含。
      # anyhow(RUSTSEC-2026-0190) 与 event-listener(RUSTSEC-2026-0221) 的补丁版
      # 已在 v0.5.8 升级到位，对应 ignore 已移除——**有修复版就升级，别加 ignore**。
      - name: Audit Rust dependencies
        run: cargo audit --ignore RUSTSEC-2024-0429

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --workspace

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm run test

      - name: Build frontend
        run: npm run build
