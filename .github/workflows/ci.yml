name: CI

on:
  push:
    # 只对分支推送触发；tag 推送的门禁由 release.yml 自己执行，
    # 避免每次发版多出一条检出 tag 提交的重复 CI（易被误读为发布失败）
    branches:
      - "**"
  pull_request:

# S-13：显式声明最小权限，默认令牌只读
permissions:
  contents: read

jobs:
  checks:
    name: Build and test
    runs-on: windows-latest

    steps:
      # S-13：第三方 Action 一律按 commit SHA 锁定，防 tag 被移动指向恶意提交
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # 锁 SHA 后 action 无法从 ref 名推断 toolchain，必须显式传 toolchain
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # S-01：pull_request 会执行 PR 内的 workflow 与 lockfile。令牌只读、无
      # secrets，但 npm 安装脚本仍会在 runner 上执行任意代码——当前依赖树零安装
      # 脚本，--ignore-scripts 是零成本的加固。
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      # S-09：与 release.yml 统一为 low，避免发布门禁比 CI 严导致「CI 绿、发布红」
      - name: Audit frontend dependencies
        run: npm audit --audit-level=low

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      # S-13：Rust 依赖漏洞审计。ignore 三项均为 unsound 类公告（非可利用漏洞）：
      # RUSTSEC-2024-0429 glib——Linux-only gtk 栈，tauri 2 上游锁 0.18，Windows 产物不含；
      # RUSTSEC-2026-0190 anyhow / RUSTSEC-2026-0221 event-listener——暂无 semver 兼容修复版，
      # 出现修复版后应升级并移除对应 ignore。
      - name: Audit Rust dependencies
        run: cargo audit --ignore RUSTSEC-2024-0429 --ignore RUSTSEC-2026-0190 --ignore RUSTSEC-2026-0221

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --workspace

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm run test

      - name: Build frontend
        run: npm run build
