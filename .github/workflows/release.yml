name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "待演练版本（vX.Y.Z）；检出所选分支，不创建 tag 或 Release"
        required: true
        type: string

# 默认只读；仅真实 tag 发布 job 获得原有 contents 写权限。
permissions:
  contents: read

jobs:
  windows:
    name: Build Windows installers
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write

    # 两个 job 复用同一套门禁，避免演练与发布漂移；权限仍分别声明。
    steps: &windows_steps
      # S-13：第三方 Action 一律按 commit SHA 锁定，防 tag 被移动指向恶意提交
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: npm

      - name: Test release checks
        run: node --test scripts/test-release-check.mjs

      # 输入只经环境变量传递，不把手动输入插入 shell 脚本。
      - name: Verify release versions and notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: node scripts/release-check.mjs --tag "$env:RELEASE_TAG"

      - name: Read Rust toolchain
        id: rust_version
        run: node scripts/release-check.mjs --toolchain

      # 锁 SHA 后 action 无法从 ref 名推断 toolchain，显式传入文件中的固定版本。
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust_version.outputs.version }}
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # S-01：安装脚本不参与构建，显式禁用
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm test

      - name: Audit frontend dependencies
        run: npm audit --audit-level=low

      - name: Install cargo-audit
        # 本机 cargo audit --version 与 cargo install --list 已核实为 0.22.2。
        run: cargo install --locked cargo-audit --version '=0.22.2'

      # 发布门禁与 CI 同强度，不忽略任何公告。
      - name: Audit Rust dependencies
        run: cargo audit

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # 演练跑完整安装包构建，但不传令牌、不创建 Release、不上传发布资产。
      - name: Rehearse Windows packaging without publishing
        if: github.event_name == 'workflow_dispatch'
        run: npm run tauri:build -- -- --locked

      # 发布说明与 tag 一起提交，直接用于 Release 正文，避免正文与仓库脱节。
      - name: Read release notes
        if: github.event_name == 'push'
        id: release_notes
        shell: pwsh
        run: |
          $releaseNotesPath = Join-Path 'docs/releases' ($env:GITHUB_REF_NAME + '.md')
          if (-not (Test-Path -LiteralPath $releaseNotesPath -PathType Leaf)) {
            throw "缺少发布说明：$releaseNotesPath"
          }
          $releaseNotes = Get-Content -LiteralPath $releaseNotesPath -Raw
          if ([string]::IsNullOrWhiteSpace($releaseNotes)) {
            throw "发布说明为空：$releaseNotesPath"
          }
          $releaseDelimiter = 'RELEASE_NOTES_' + [guid]::NewGuid().ToString('N')
          @("body<<$releaseDelimiter", $releaseNotes.TrimEnd(), $releaseDelimiter) |
            Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build and publish Tauri release
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          args: '-- --locked'
          releaseName: Seraph Audio Player ${{ github.ref_name }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false

  rehearsal:
    name: Rehearse Windows installers (no release)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps: *windows_steps
